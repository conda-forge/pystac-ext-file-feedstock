schema_version: 1

context:
  version: "2.1.1"

package:
  name: pystac-ext-file
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-file/pystac_ext_file-${{ version }}.tar.gz
  sha256: b2b72eedc7c77dd3ff4efe2ff57956046cd1e66ab28d53df0b693e56c37d1c96

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.file
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: File extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-file/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
